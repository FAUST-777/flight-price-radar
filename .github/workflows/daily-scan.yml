name: daily-scan

on:
  schedule:
    # 台灣時間 06:30 / 08:30 / 10:30 各跑一次;掃描器有當日冪等檢查,
    # 今天已成功就直接跳過——多班次是為了 runner IP 被 Google 降級時自動重試
    - cron: "30 22 * * *"
    - cron: "30 0 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "今天已掃過也強制重掃"
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/scan.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          FORCE_SCAN: ${{ github.event.inputs.force || '' }}
