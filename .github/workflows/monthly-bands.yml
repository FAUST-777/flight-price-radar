name: monthly-bands

on:
  schedule:
    # 每週一 07:30 台灣時間(週日 23:30 UTC)
    - cron: "30 23 * * 0"
  workflow_dispatch: {}

jobs:
  bands:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/monthly-bands.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
